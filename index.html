<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f3ee">
  <meta name="description" content="A shelf of browser toys, tools, and half-baked ideas by San.">
  <title>San's Playground</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <!-- ?v= is a cache buster: bump it on every deploy so nobody gets yesterday's CSS. -->
  <link rel="stylesheet" href="styles.css?v=2026-09-05c">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕹️</text></svg>">

  <!-- Set the theme before first paint, or the page flashes the wrong one. -->
  <script>
    try {
      var saved = localStorage.getItem('playground:theme');
      if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
    } catch (e) { /* storage blocked — dark is the default anyway */ }
  </script>
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>

  <div class="wrap">
    <nav class="nav" data-nav aria-label="Site">
      <div class="nav__spacer"></div>
      <button type="button" class="chip chip--muted" data-theme-toggle aria-label="Switch colour theme">Light</button>
    </nav>

    <header class="stage">
      <div class="stage__sky" aria-hidden="true">
        <svg class="cloud cloud--a" viewBox="0 0 16 8" aria-hidden="true"><g fill="currentColor"><rect x="4" y="2" width="8" height="4"/><rect x="2" y="4" width="12" height="2"/><rect x="6" y="1" width="4" height="1"/><rect x="3" y="3" width="2" height="1"/><rect x="11" y="3" width="2" height="1"/></g></svg>
        <svg class="cloud cloud--b" viewBox="0 0 16 8" aria-hidden="true"><g fill="currentColor"><rect x="4" y="2" width="8" height="4"/><rect x="2" y="4" width="12" height="2"/><rect x="6" y="1" width="4" height="1"/><rect x="3" y="3" width="2" height="1"/><rect x="11" y="3" width="2" height="1"/></g></svg>
        <svg class="cloud cloud--c" viewBox="0 0 16 8" aria-hidden="true"><g fill="currentColor"><rect x="4" y="2" width="8" height="4"/><rect x="2" y="4" width="12" height="2"/><rect x="6" y="1" width="4" height="1"/><rect x="3" y="3" width="2" height="1"/><rect x="11" y="3" width="2" height="1"/></g></svg>
        <svg class="hills" viewBox="0 0 64 20" preserveAspectRatio="none" aria-hidden="true">
          <g fill="var(--hill-dark)">
            <rect x="36" y="10" width="20" height="10"/><rect x="40" y="7" width="12" height="3"/><rect x="44" y="5" width="4" height="2"/>
          </g>
          <g fill="var(--hill)">
            <rect x="3" y="12" width="18" height="8"/><rect x="6" y="9" width="12" height="3"/><rect x="9" y="7" width="6" height="2"/>
            <rect x="24" y="15" width="10" height="5"/><rect x="26" y="13" width="6" height="2"/>
          </g>
        </svg>

        <div class="props">
          <svg class="prop prop--brick" viewBox="0 0 8 8" aria-hidden="true"><rect width="8" height="8" fill="var(--brick)"/><g fill="var(--mortar)"><rect y="0" width="8" height="1"/><rect y="4" width="8" height="1"/><rect x="4" y="1" width="1" height="3"/><rect x="1" y="5" width="1" height="3"/><rect x="6" y="5" width="1" height="3"/></g></svg>
          <svg class="prop prop--block" viewBox="0 0 8 8" aria-hidden="true"><rect width="8" height="8" fill="var(--block)"/><rect width="8" height="1" fill="var(--block-ink)"/><rect y="7" width="8" height="1" fill="var(--block-ink)"/><rect width="1" height="8" fill="var(--block-ink)"/><rect x="7" width="1" height="8" fill="var(--block-ink)"/><g fill="var(--block-ink)"><rect x="3" y="2" width="2" height="4"/><rect x="2" y="3" width="4" height="2"/><rect x="2" y="2" width="1" height="1"/><rect x="5" y="2" width="1" height="1"/><rect x="2" y="5" width="1" height="1"/><rect x="5" y="5" width="1" height="1"/></g></svg>
          <svg class="prop prop--coin" viewBox="0 0 8 8" aria-hidden="true"><g fill="var(--coin)"><rect x="2" y="1" width="4" height="6"/><rect x="1" y="2" width="6" height="4"/></g><g fill="var(--coin-ink)"><rect x="3" y="2" width="2" height="4"/></g></svg>
        </div>
      </div>

      <div class="stage__content">
        <h1 class="stage__title">San&#39;s Playground</h1>
        <p class="stage__lede">A shelf of browser toys, tools, and half-baked ideas.</p>
        <div class="stage__stats">
          <span class="stat">Shelf 1-1</span>
          <span class="stat"><svg class="stat__coin" viewBox="0 0 8 8" aria-hidden="true"><g fill="var(--coin)"><rect x="2" y="1" width="4" height="6"/><rect x="1" y="2" width="6" height="4"/></g><g fill="var(--coin-ink)"><rect x="3" y="2" width="2" height="4"/></g></svg><span data-count>0 cartridges</span></span>
        </div>
      </div>

      <div class="stage__ground" aria-hidden="true"><span></span><span></span></div>
    </header>

    <main class="shelf" data-shelf aria-label="Cartridges">
      <noscript>
        <p class="noscript">
          This shelf is built with JavaScript. Without it, here are the direct links:
          <a href="/FoodBillCalculator/" target="_blank" rel="noopener noreferrer">Split the Bill</a> ·
          <a href="/San-gularity/" target="_blank" rel="noopener noreferrer">Sans Archive</a>
        </p>
      </noscript>
    </main>

    <footer class="footer">
      <div class="footer__cols">
        <div class="footer__col" data-links-shelf>
          <div class="footer__head">Shelf</div>
        </div>
        <div class="footer__col" data-links-elsewhere>
          <div class="footer__head">Elsewhere</div>
        </div>
        <div class="footer__col footer__col--coin" data-links-coin>
          <div class="footer__head">Insert coin</div>
          <p class="footer__note" data-coin-note>Everything here is free. Coffee keeps the shelf growing.</p>
        </div>
      </div>

      <div class="footer__bottom">
        <span class="count">Shelf 1-1</span>
        <span class="colophon">Built by San.</span>
      </div>
    </footer>
  </div>

  <script type="module" src="main.js?v=2026-09-05c"></script>
  <script type="module" src="climber.js?v=2026-09-05c"></script>
</body>
</html>
