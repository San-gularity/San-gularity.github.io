<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f3ee">
  <meta name="robots" content="noindex">
  <title>Cartridge Not Found — San's Playground</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css?v=2026-09-06e">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕹️</text></svg>">

  <script>
    try {
      var saved = localStorage.getItem('playground:theme');
      if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
    } catch (e) {}
  </script>
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>

  <!-- 404.html is served for any missing path on the domain, so its asset links
       are absolute — a relative one would break at /some/deep/path/. -->
  <main class="notfound">
    <div class="notfound__code" aria-hidden="true">404</div>
    <h1 class="notfound__title">Cartridge Not Found</h1>
    <p class="notfound__text">That slot is empty. Nothing was saved.</p>
    <a class="notfound__home" href="/">Insert Coin (Go Home)</a>
  </main>

  <div class="notfound__ground" aria-hidden="true"><span></span><span></span></div>
</body>
</html>
